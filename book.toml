[book]
title = "SorobanPulse Documentation"
description = "Lightweight Rust service that indexes Soroban smart contract events and exposes them via REST API, SSE, and webhooks."
authors = ["Soroban-Pulse contributors"]
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/SorobanPulse/"
git-repository-url = "https://github.com/Soroban-Pulse/SorobanPulse"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Soroban-Pulse/SorobanPulse/edit/main/{path}"
no-section-label = false
additional-css = ["docs/theme/custom.css"]
additional-js = ["docs/theme/edit-link.js"]
cname = ""
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.redirect]
# SCREAMING_CASE.md -> kebab-case subdirectories
"SAAS_PLATFORM.md" = "integrations/saas-platform.md"
"ML_INTEGRATION.md" = "integrations/ml-integration.md"
"QUERY_PLAN_CACHING.md" = "operations/query-plan-caching.md"

# snake_case.md -> kebab-case subdirectories
"audit_logging.md" = "operations/audit-logging.md"
"bulk_export.md" = "guides/bulk-export.md"
"cross_chain_correlation.md" = "reference/cross-chain-correlation.md"
"data-retention-tiers.md" = "operations/data-retention-tiers.md"

# Merged duplicate-topic pages
"audit-trail.md" = "operations/audit-logging.md"
"cross-chain-events.md" = "reference/cross-chain-correlation.md"
"data-retention.md" = "operations/data-retention-tiers.md"

# Missing pages referenced by SUMMARY.md (issue #1483) -> existing equivalents
"api-contract-testing.md" = "contract-testing.md"
"property-testing.md" = "contract-testing.md"

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2"
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
after = ["links"]