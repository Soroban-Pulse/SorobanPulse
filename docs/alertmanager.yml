global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "default-slack"
  group_by: ["alertname", "component", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: "pagerduty-critical"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: true
    - match:
        severity: critical
      receiver: "slack-critical"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "slack-warning"
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 4h
    - match:
        component: indexer
      receiver: "slack-indexer"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
    - match:
        component: database
      receiver: "slack-database"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
    - match:
        component: notifications
      receiver: "slack-notifications"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

receivers:
  - name: "default-slack"
    slack_configs:
      - channel: "#soroban-pulse-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"
          - type: button
            text: "Dashboard :chart_with_upwards_trend:"
            url: "https://grafana.soroban-pulse.io/d/soroban-pulse"

  - name: "slack-critical"
    slack_configs:
      - channel: "#soroban-pulse-critical"
        send_resolved: true
        title: '{{ template "slack.critical.title" . }}'
        text: '{{ template "slack.critical.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"
          - type: button
            text: "Acknowledge in PagerDuty"
            url: "https://soroban-pulse.pagerduty.com/incidents"

  - name: "slack-warning"
    slack_configs:
      - channel: "#soroban-pulse-warnings"
        send_resolved: true
        title: '{{ template "slack.warning.title" . }}'
        text: '{{ template "slack.warning.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "slack-indexer"
    slack_configs:
      - channel: "#soroban-pulse-indexer"
        send_resolved: true
        title: '{{ template "slack.indexer.title" . }}'
        text: '{{ template "slack.indexer.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "slack-database"
    slack_configs:
      - channel: "#soroban-pulse-database"
        send_resolved: true
        title: '{{ template "slack.database.title" . }}'
        text: '{{ template "slack.database.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "slack-notifications"
    slack_configs:
      - channel: "#soroban-pulse-notifications"
        send_resolved: true
        title: '{{ template "slack.notifications.title" . }}'
        text: '{{ template "slack.notifications.text" . }}'
        actions:
          - type: button
            text: "Runbook :book:"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "pagerduty-critical"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'
        severity: '{{ (index .Alerts 0).Labels.severity }}'
        source: "soroban-pulse"
        component: '{{ (index .Alerts 0).Labels.component }}'
        class: "soroban-pulse-alert"
        images:
          - src: "https://grafana.soroban-pulse.io/render/d/soroban-pulse?orgId=1"
            alt: "Grafana Dashboard"
            href: "https://grafana.soroban-pulse.io/d/soroban-pulse"
        links:
          - href: "{{ (index .Alerts 0).Annotations.runbook_url }}"
            text: "Runbook"
        details:
          num_alerts: "{{ .Alerts | len }}"
          status: "{{ .Status }}"
          alerts: "{{ range .Alerts }}- {{ .Annotations.summary }}\n{{ end }}"

  - name: "opsgenie-critical"
    opsgenie_configs:
      - api_key: "${OPSGENIE_API_KEY}"
        api_url: "https://api.opsgenie.com/v2/alerts"
        message: '{{ .GroupLabels.alertname }}'
        description: "{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}"
        responders:
          - type: team
            name: "SorobanPulse On-Call"
        source: "soroban-pulse"
        priority: "P1"
        tags:
          - "soroban-pulse"
          - "{{ (index .Alerts 0).Labels.component }}"
          - "{{ (index .Alerts 0).Labels.severity }}"

  - name: "victorops-critical"
    victorops_configs:
      - api_key: "${VICTOROPS_API_KEY}"
        api_url: "https://alert.victorops.com/integrations/0OMF575/summary"
        state: "{{ if eq .Status \"firing\" }}CRITICAL{{ else }}RECOVERY{{ end }}"
        message: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'
        entity_display_name: "soroban-pulse-{{ (index .Alerts 0).Labels.component }}"
        monitoring_tool: "Prometheus"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "component"]
  - source_match:
      alertname: IndexerLagCritical
    target_match:
      alertname: IndexerLagHigh
    equal: ["component"]
  - source_match:
      alertname: ReplicaLagCritical
    target_match:
      alertname: ReplicaLagHigh
    equal: ["component", "client_addr"]
