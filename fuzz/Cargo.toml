[package]
name = "soroban-pulse-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"
rust-version = "1.87"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-pulse = { path = "..", features = [] }
serde_json = "1"
# Pinned to the same stellar-xdr version/features as the root crate so fuzz
# targets decode XDR identically to the library (see issue #1420). The fuzz
# crate is its own `[workspace]`, so `workspace = true` cannot be used here.
stellar-xdr = { version = "26.0.1", default-features = false, features = ["std", "curr", "base64", "serde"] }

# Prevent this from interfering with the workspace
[workspace]

[[bin]]
name = "fuzz_validate_contract_id"
path = "fuzz_targets/fuzz_validate_contract_id.rs"
test = false
doc = false

[[bin]]
name = "fuzz_validate_tx_hash"
path = "fuzz_targets/fuzz_validate_tx_hash.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pagination_params"
path = "fuzz_targets/fuzz_pagination_params.rs"
test = false
doc = false

# ── Issue #1154: new fuzz targets ──────────────────────────────────────────

[[bin]]
name = "fuzz_xdr_scval"
path = "fuzz_targets/fuzz_xdr_scval.rs"
test = false
doc = false

[[bin]]
name = "fuzz_normalizer"
path = "fuzz_targets/fuzz_normalizer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_contract_spec"
path = "fuzz_targets/fuzz_contract_spec.rs"
test = false
doc = false