# Single compose file for all local and CI scenarios.
#
# Profiles:
#   core          - postgres (db) + api (app)
#   observability - prometheus, grafana, jaeger, loki, promtail
#   e2e           - db, rpc-stub, app, seed, seed-bin, webhook-sink, web
#   conformance   - db, rpc-stub, app, webhook-sink
#
# Usage (prefer the Make targets):
#   make up               # core
#   make up-observability # core + observability
#   make e2e              # e2e
#   make conformance      # conformance
#   make down             # stop everything
#
# Or directly:
#   docker compose --profile core up -d --wait
#   docker compose --profile conformance up -d --wait
#   docker compose --profile core --profile observability up -d --wait

x-postgres-common: &postgres-common
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-soroban}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soroban}
    POSTGRES_DB: ${POSTGRES_DB:-soroban_pulse}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soroban} -d ${POSTGRES_DB:-soroban_pulse}"]
    interval: 5s
    timeout: 5s
    retries: 10

x-app-common: &app-common
  build: .
  environment:
    STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
    START_LEDGER: ${START_LEDGER:-0}
    PORT: "3000"
    RUST_LOG: ${RUST_LOG:-info}
  ports:
    - "3000:3000"
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz/ready || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 30s

x-webhook-sink-common: &webhook-sink-common
  image: python:3.12-alpine
  command:
    - "python"
    - "-c"
    - |
      import http.server, json, sys
      class H(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get('Content-Length', 0))
              body = self.rfile.read(length)
              sys.stdout.write(json.dumps({
                  'path': self.path,
                  'headers': dict(self.headers),
                  'body': body.decode('utf-8', 'replace'),
              }) + "\n")
              sys.stdout.flush()
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'ok')
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'ok')
          def log_message(self, *args):
              pass
      http.server.HTTPServer(('0.0.0.0', 9002), H).serve_forever()
  ports:
    - "9002:9002"
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9002/healthz')\" || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 5s

services:
  # ---------------------------------------------------------------------------
  # core
  # ---------------------------------------------------------------------------
  db:
    <<: *postgres-common
    profiles: ["core", "e2e", "conformance"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    <<: *app-common
    profiles: ["core", "e2e", "conformance"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-soroban}:${POSTGRES_PASSWORD:-soroban}@db:5432/${POSTGRES_DB:-soroban_pulse}}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      START_LEDGER: ${START_LEDGER:-0}
      PORT: "3000"
      RUST_LOG: ${RUST_LOG:-info}

  # ---------------------------------------------------------------------------
  # observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana-dashboard.json:/var/lib/grafana/dashboards/soroban-pulse-sla.json:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.0.0
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.0.0
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  redis:
    image: redis:7-alpine
    profiles: ["observability"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # e2e
  # ---------------------------------------------------------------------------
  rpc-stub:
    image: python:3.12-alpine
    profiles: ["e2e", "conformance"]
    command:
      - "python"
      - "-c"
      - |
        import http.server, json, sys
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(length)
                sys.stdout.write(json.dumps({
                    'path': self.path,
                    'body': body.decode('utf-8', 'replace'),
                }) + "\n")
                sys.stdout.flush()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"jsonrpc":"2.0","id":1,"result":{}}')
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'ok')
            def log_message(self, *args):
                pass
        http.server.HTTPServer(('0.0.0.0', 8000), H).serve_forever()
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  seed:
    build: .
    profiles: ["e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-soroban}:${POSTGRES_PASSWORD:-soroban}@db:5432/${POSTGRES_DB:-soroban_pulse}}
    command: ["/bin/sh", "-c", "true"]
    restart: "no"

  seed-bin:
    build: .
    profiles: ["e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-soroban}:${POSTGRES_PASSWORD:-soroban}@db:5432/${POSTGRES_DB:-soroban_pulse}}
    command: ["/bin/sh", "-c", "true"]
    restart: "no"

  web:
    image: nginx:1.27-alpine
    profiles: ["e2e"]
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # e2e + conformance
  # ---------------------------------------------------------------------------
  webhook-sink:
    <<: *webhook-sink-common
    profiles: ["e2e", "conformance"]

volumes:
  pgdata:
  promdata:
  grafanadata:
  redisdata:
  lokidata:
