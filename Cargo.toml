[package]
name = "soroban-pulse"
version = "1.0.0"
edition = "2021"
authors = ["SorobanPulse Team"]
description = "Real-time event streaming and observability platform for Soroban/Stellar blockchain"
license = "MIT"
repository = "https://github.com/Soroban-Pulse/SorobanPulse"

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
diesel = { version = "2.1", features = ["postgres", "uuid", "chrono", "serde_json"], optional = true }

# Cryptography - Classical
ed25519-dalek = "2.1"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# Cryptography - Post-Quantum (optional feature)
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-kyber = { version = "0.8", optional = true }
pqcrypto-falcon = { version = "0.3", optional = true }
pqcrypto-sphincsplus = { version = "0.7", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

# Time and dates
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.14"
opentelemetry-jaeger = "0.20"

# Metrics
prometheus = "0.13"
metrics = "0.21"

# Configuration
config = "0.13"
dotenv = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
uuid = { version = "1.6", features = ["serde", "v4"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# GraphQL
async-graphql = "7.0"
async-graphql-actix-web = "7.0"

# WebSocket
tokio-tungstenite = "0.21"

# Utilities
bytes = "1.5"
base64 = "0.21"
hex = "0.4"
# Issue #942/#941 investigation: zero_trust.rs and middleware/auth.rs both
# already used `subtle::ConstantTimeEq` for constant-time secret comparison,
# but subtle was never a direct dependency here — only ever present
# transitively (via hmac and others), which edition 2021 does not allow
# `use subtle::...` to resolve against. Version pinned to match what's
# already resolved in Cargo.lock from those transitive deps.
subtle = "2.6"

# Service mesh integration
tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
mockall = "0.12"
wiremock = "0.6"

[features]
default = ["classical-crypto"]

# Cryptography features
classical-crypto = []
quantum-crypto = [
    "pqcrypto-dilithium",
    "pqcrypto-kyber",
    "pqcrypto-falcon",
    "pqcrypto-sphincsplus",
    "pqcrypto-traits"
]
hybrid-crypto = ["classical-crypto", "quantum-crypto"]

# Service mesh features
istio = ["tonic", "prost"]
linkerd = ["tonic", "prost"]

# Observability features
full-observability = ["tracing-opentelemetry", "opentelemetry-jaeger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "quantum_crypto"
harness = false
required-features = ["quantum-crypto"]

[[bench]]
name = "hybrid_signatures"
harness = false
required-features = ["hybrid-crypto"]

[lib]
name = "soroban_pulse"
path = "src/lib.rs"

[[bin]]
name = "soroban-pulse"
path = "src/main.rs"
