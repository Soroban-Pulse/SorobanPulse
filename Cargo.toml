[package]
name = "soroban-pulse"
version = "1.0.0"
edition = "2021"
rust-version = "1.87"
authors = ["SorobanPulse Team"]
description = "Real-time event streaming and observability platform for Soroban/Stellar blockchain"
license = "MIT"
repository = "https://github.com/Soroban-Pulse/SorobanPulse"

[workspace]
members = ["cli", "fuzz"]

[workspace.dependencies]
# Stellar XDR (ScVal rendering, ledger meta / contract spec decoding).
# 26.x is the newest line that still ships the `curr` module the codebase
# imports. Every crate in the workspace inherits this single version so the
# indexer, CLI and fuzzers all decode the same bytes identically.
stellar-xdr = { version = "26.0.1", default-features = false, features = ["std", "curr", "base64", "serde"] }

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
http = "1"
http-body-util = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
tower_governor = "0.7"
governor = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros"] }

# Cryptography - Classical
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2.6"
aes-gcm = "0.10"
# Issue #1421: RSA PKCS#1 v1.5 verification of AWS SNS message signatures.
rsa = { version = "0.9", features = ["sha1", "sha2"] }


# Time and dates
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.14"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Configuration
config = "0.13"
dotenv = "0.15"
dotenvy = "0.15"
serde_yaml = "0.9"
jsonschema = "0.18"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
uuid = { version = "1.6", features = ["serde", "v4"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# GraphQL
async-graphql = "7.0"

# Issue #1349: Parquet event export (enabled by the `parquet` feature)
parquet = { version = "53", default-features = false, features = ["arrow", "snap"], optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }

# Utilities
bytes = "1.5"
base64 = "0.21"
hex = "0.4"
regex = "1"
blake3 = "1"
toml = "0.8"
secrecy = "0.5"
rand = "0.8"

# Stellar XDR (ScVal rendering, ledger meta / contract spec decoding) and
# zstd for Galexie ledger files (issues #1252-#1254). Inherited from the
# workspace so every crate shares a single version.
stellar-xdr.workspace = true
zstd = "0.13"

# Caching / concurrency
dashmap = "6"
moka = { version = "0.12", features = ["future", "sync"] }
bloomfilter = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2"

# Compression
flate2 = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd", "brotli"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }

# Profiling
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"] }

# Heavy / deployment-specific integrations
# (optional; enabled through the matching cargo features below)
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "async"], optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-sdk-kinesis = { version = "1", optional = true }
redis = { version = "0.27", features = ["tokio-comp", "aio"], optional = true }

# HTTP middleware / static files (the `fs` feature is enabled by `dashboard`)
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full", "metrics", "request-id", "limit"] }

# Service mesh integration
tonic = { version = "0.10", optional = true }

# Messaging integrations (optional, enabled per-deployment)
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
google-cloud-pubsub = { version = "0.33", optional = true }
url = { version = "2.5" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3"
wiremock = "0.6"
insta = "1"

# Issue #1415: Criterion benchmarks require `harness = false`; otherwise Cargo
# links the default libtest harness, which conflicts with `criterion_main!`.
[[bench]]
name = "compression"
harness = false

[[bench]]
name = "conditional_get"
harness = false

[[bench]]
name = "db_queries"
harness = false

[[bench]]
name = "pagination"
harness = false

[[bench]]
name = "query_planning"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "serialization_cache"
harness = false

[[bench]]
name = "streaming_response"
harness = false

# Issue #1441: development-only binaries. They are not built unless the
# `dev-tools` feature is enabled, keeping production images free of them.
[[bin]]
name = "gen_env_docs"
path = "src/bin/gen_env_docs.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gen_config_docs"
path = "src/bin/gen_config_docs.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_openapi"
path = "src/bin/dump_openapi.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gen_postman"
path = "src/bin/gen_postman.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gen_subscription_scaffold"
path = "src/bin/gen_subscription_scaffold.rs"
required-features = ["dev-tools"]

[[bin]]
name = "pg_tuning_advisor"
path = "src/bin/pg_tuning_advisor.rs"
required-features = ["dev-tools"]

[[bin]]
name = "schema_cli"
path = "src/bin/schema_cli.rs"
required-features = ["dev-tools"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["dev-tools"]

[features]
default = ["dashboard"]

# Issue #1441: gates development-only binaries (seed, code generators, tooling)
# so `cargo build --release` produces only the server.
dev-tools = []

# Issue #1112: serve the built web dashboard at /ui (runtime opt-in: SERVE_DASHBOARD=true).
# Build with --no-default-features to drop it.
dashboard = ["tower-http/fs"]

# Cryptography features
classical-crypto = []
# Issue #1484: Post-quantum crypto is Planned/Experimental — no code currently
# references the pqcrypto crates, so enabling this feature has no effect.
# See docs/feature-maturity.md for the authoritative maturity status.
quantum-crypto = [
    "pqcrypto-dilithium",
    "pqcrypto-kyber",
    "pqcrypto-falcon",
    "pqcrypto-sphincsplus",
    "pqcrypto-traits"
]
hybrid-crypto = ["classical-crypto", "quantum-crypto"]

# Service mesh features
istio = ["tonic"]
linkerd = ["tonic"]

# Observability features
full-observability = ["otel"]
otel = ["dep:tracing-opentelemetry"]

# Messaging integrations
kafka = ["dep:rdkafka"]
sqs = []
pubsub = ["dep:google-cloud-pubsub"]
kinesis = ["dep:aws-config", "dep:aws-sdk-kinesis"]
redis-queue = ["dep:redis"]
archive = ["dep:aws-config", "dep:aws-sdk-s3"]
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
lua = ["dep:mlua"]
graphql = []
encryption = []

# Issue #1349: Parquet export via GET /v1/events/export?format=parquet (feature defined above)

# Issue #1350: GraphQL API, including subscriptions over WebSocket at /graphql/ws (feature defined above)

# Chaos testing (gates tests/chaos_tests.rs advisory-lock failover tests)
chaos = []

[lints.clippy]
# Lint policy — replaces the crate-level #![deny]/#![allow] that used to live
# in src/main.rs. Keeping it here makes the configuration visible and applies
# consistently to both the library and binary targets.
all = "deny"
pedantic = "deny"
# AppError, AppState, etc. — repeating the module name is idiomatic in Rust.
module_name_repetitions = "allow"
# Internal service; these are not public library APIs.
missing_errors_doc = "allow"
# Panics only occur on misconfiguration at startup.
missing_panics_doc = "allow"
# Used sparingly in test modules only.
wildcard_imports = "allow"
# Issue #1434: a panic in a request handler or background task can abort a
# request, poison a mutex or silently kill a long-running task. These start as
# `warn` so the existing call sites can be converted module by module; raise
# them to `deny` once the non-test count reaches zero. Test modules are exempt
# via `allow-unwrap-in-tests` / `allow-expect-in-tests` in `.clippy.toml`.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[lib]
name = "soroban_pulse"
path = "src/lib.rs"

[[bin]]
name = "soroban-pulse"
path = "src/main.rs"