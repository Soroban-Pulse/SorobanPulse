# Clippy configuration for the project.
#
# See https://doc.rust-lang.org/clippy/configuration.html for the full list of
# supported options.
#
# Issue #1434: We are rolling out `clippy::unwrap_used` and
# `clippy::expect_used` across the request-serving code paths. Panics in
# handlers or background tasks are a denial-of-service vector, so we want the
# lints to fire in non-test code. Tests, however, legitimately use
# `unwrap()`/`expect()` to assert on results, so we allow them there.

# Allow `unwrap()`/`expect()` inside `#[cfg(test)]` code (and test modules) so
# the `clippy::unwrap_used` / `clippy::expect_used` lints only flag production
# code paths.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Issue #1427: All outbound HTTP must go through the shared `OutboundClient`
# wrapper in `src/net/` (which validates the URL, pins the resolved IP,
# validates redirects, and applies timeouts/size limits). Direct construction
# of a `reqwest::Client` outside `src/net` is therefore disallowed so that
# integration modules cannot bypass the SSRF guard.
#
# The `src/net/` module is the sole permitted construction site; it is
# excluded from this lint via `#[allow(clippy::disallowed_methods)]` on the
# wrapper implementation (see `src/net/outbound.rs`).
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "Use crate::net::OutboundClient instead (SSRF guard, issue #1427)" },
    { path = "reqwest::Client::builder", reason = "Use crate::net::OutboundClient instead (SSRF guard, issue #1427)" },
]
# Also allow the `panic!`-style lints in tests, for the same reason.
allow-panic-in-tests = true

# Allow `unwrap()`/`expect()` in code that is only compiled for benchmarks,
# since benchmarks are not part of the request-serving path.
allow-unwrap-in-benchmarks = true
allow-expect-in-benchmarks = true
