# .clippy.toml — Project-specific Clippy configuration
#
# Lint enforcement is set in src/main.rs:
#   #![deny(clippy::all, clippy::pedantic)]
#
# Intentional suppressions are documented below alongside their rationale.

# Allow functions with many arguments — some handler/builder functions
# legitimately require several parameters and splitting them would reduce clarity.
too-many-arguments-threshold = 8

# Allow long functions in integration-heavy modules (e.g. handlers, indexer).
too-many-lines-threshold = 120

# Issue #1246: `clippy::unwrap_used` / `clippy::expect_used` are denied in
# src/ (see the crate attributes in src/lib.rs, src/main.rs and src/bin/*);
# panicking helpers remain fine inside #[test] / #[cfg(test)] code.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Issue #1427: All outbound HTTP must go through the shared `OutboundClient`
# wrapper in `src/net/` (which validates the URL, pins the resolved IP,
# validates redirects, and applies timeouts/size limits). Direct construction
# of a `reqwest::Client` outside `src/net` is therefore disallowed so that
# integration modules cannot bypass the SSRF guard.
#
# The `src/net/` module is the sole permitted construction site; it is
# excluded from this lint via `#[allow(clippy::disallowed_methods)]` on the
# wrapper implementation (see `src/net/outbound.rs`).
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "Use crate::net::OutboundClient instead (SSRF guard, issue #1427)" },
    { path = "reqwest::Client::builder", reason = "Use crate::net::OutboundClient instead (SSRF guard, issue #1427)" },
]