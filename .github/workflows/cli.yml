name: CLI

# Builds and tests the standalone `spulse` crate in cli/, which is not part
# of the root workspace and so is not covered by ci.yml.
#
# On release tags (v*), also builds the four target archives, computes their
# sha256 checksums, and opens a PR that updates formulas/spulse.rb so the
# Homebrew formula never ships with placeholder checksums.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cli/**"
      - "formulas/spulse.rb"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "formulas/spulse.rb"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  cli:
    name: Test & Build (spulse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

  build-archives:
    name: Build archive (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: spulse-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: spulse-x86_64-apple-darwin.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: spulse-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: spulse-x86_64-unknown-linux-gnu.tar.gz
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/spulse" dist/spulse
          tar -C dist -czf "${{ matrix.archive }}" spulse
          shasum -a 256 "${{ matrix.archive }}" | awk '{print $1}' > "${{ matrix.archive }}.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            cli/${{ matrix.archive }}
            cli/${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List archives
        run: ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          fail_on_unmatched_files: true

  bump-formula:
    name: Update Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums and update formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          formula="formulas/spulse.rb"
          test -f "$formula"

          sha_aarch64_darwin="$(cat dist/spulse-aarch64-apple-darwin.tar.gz.sha256)"
          sha_x86_64_darwin="$(cat dist/spulse-x86_64-apple-darwin.tar.gz.sha256)"
          sha_aarch64_linux="$(cat dist/spulse-aarch64-unknown-linux-gnu.tar.gz.sha256)"
          sha_x86_64_linux="$(cat dist/spulse-x86_64-unknown-linux-gnu.tar.gz.sha256)"

          # Update version line.
          sed -i -E "s/^(\s*version\s+)\"[^\"]*\"/\1\"${version}\"/" "$formula"

          # Replace each placeholder/old checksum with the freshly computed one.
          python3 - "$formula" \
            "$sha_aarch64_darwin" "$sha_x86_64_darwin" \
            "$sha_aarch64_linux" "$sha_x86_64_linux" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          checksums = {
              "aarch64-apple-darwin": sys.argv[2],
              "x86_64-apple-darwin": sys.argv[3],
              "aarch64-unknown-linux-gnu": sys.argv[4],
              "x86_64-unknown-linux-gnu": sys.argv[5],
          }

          with open(path, "r", encoding="utf-8") as fh:
              content = fh.read()

          for target, checksum in checksums.items():
              # Match a `url ...<target>...` line followed by a `sha256 "..."` line.
              pattern = re.compile(
                  r'(url\s+"[^"]*' + re.escape(target) + r'[^"]*"\s*\n\s*sha256\s+)"[^"]*"'
              )
              content, count = pattern.subn(r'\1"' + checksum + '"', content)
              if count == 0:
                  raise SystemExit(f"no url/sha256 pair found for target {target}")

          with open(path, "w", encoding="utf-8") as fh:
              fh.write(content)
          PY

          if git diff --quiet -- "$formula"; then
            echo "Formula already up to date for ${TAG}"
            exit 0
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(homebrew): bump spulse formula to ${{ github.ref_name }}"
          title: "chore(homebrew): bump spulse formula to ${{ github.ref_name }}"
          body: |
            Automated update of `formulas/spulse.rb` for release `${{ github.ref_name }}`.

            Checksums were computed from the published release archives.
          branch: homebrew/bump-spulse-${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            formulas/spulse.rb