name: VS Code Extension Release

# Publishes vscode-extension/ to the VS Code Marketplace and Open VSX when a
# `vscode-extension-vX.Y.Z` tag is pushed. The tag version must match
# vscode-extension/package.json. Required repository secrets:
#   VSCE_PAT  - Azure DevOps PAT with Marketplace "Manage" scope for the publisher
#   OVSX_PAT  - Open VSX access token for the same namespace

on:
  push:
    tags: ["vscode-extension-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Package & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a3b0b5e1e2b0c1e2b0c1e2b0c1e2b0c1e # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-extension-v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - run: npm ci

      - name: Package
        run: npx vsce package --out soroban-pulse-explorer.vsix

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: soroban-pulse-explorer-vsix
          path: vscode-extension/soroban-pulse-explorer.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath soroban-pulse-explorer.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx@0.10 publish soroban-pulse-explorer.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: VS Code Extension ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: vscode-extension/soroban-pulse-explorer.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
