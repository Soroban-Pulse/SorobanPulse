name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost/soroban_pulse_test

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check sources
          arguments: --all-features

  check-migrations:
    name: Check Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-migrations.sh

  validate-sdk:
    name: Validate SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: make generate-sdk
      - name: Check for diffs
        run: |
          if [ -n "$(git status --porcelain sdk/)" ]; then
            echo "SDKs are out of date. Please run 'make generate-sdk' and commit the changes."
            git status --porcelain sdk/
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo clippy -- -D warnings

  test:
    name: Test (rust ${{ matrix.rust }}, pg ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-pg${{ matrix.postgres }}
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - run: cargo test

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - name: Run coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --summary-only
      - name: Write coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14
          if-no-files-found: ignore

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo test --test pact_contract_tests
      - name: Upload contract tests report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-tests-report
          path: target/debug/deps/pact_contract_tests-*
          retention-days: 7
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - run: cargo test --test integration_tests

  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - run: cargo test --test resilience

  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - run: cargo test --test chaos_tests

  bench:
    name: Bench (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo bench

  mutants:
    name: Mutation Testing (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          - module: src/models.rs
            description: "Data models"
          - module: src/indexer.rs
            description: "Event indexer"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install cargo-mutants
      - name: Run mutation tests for ${{ matrix.description }}
        run: cargo mutants -m ${{ matrix.module }} --shuffle -j 4 || true
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.module }}
          path: target/mutants/
          retention-days: 7
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run fuzz_validate_contract_id -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_validate_tx_hash -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_pagination_params -- -max_total_time=60
        working-directory: fuzz
      - name: Upload fuzz corpus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
          retention-days: 30

  build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3
      - run: cargo build --release

  docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
    # Actual publish (tagging, scanning, SBOM) happens in docker-publish.yml
    # on push to main / version tags — kept separate so PR feedback here stays fast.

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.14.0"
      - name: Lint Helm chart
        run: helm lint helm/soroban-pulse
      - name: Render template (default values)
        run: helm template soroban-pulse helm/soroban-pulse | grep -v "DATABASE_URL\|API_KEY\|SMTP_PASSWORD"
      - name: Render template (existingSecret)
        run: helm template soroban-pulse helm/soroban-pulse --set existingSecret=my-secret

  openapi:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: sudo apt-get install -y pkg-config libssl-dev
      - name: Generate OpenAPI spec
        run: cargo run --bin gen_openapi > /tmp/openapi-generated.json
      - name: Check openapi.json is up to date
        run: |
          if ! diff -q openapi.json /tmp/openapi-generated.json > /dev/null 2>&1; then
            echo "OpenAPI spec is out of date — run make gen-openapi and commit the result"
            diff openapi.json /tmp/openapi-generated.json
            exit 1
          fi
      - name: Copy spec to docs for Swagger UI
        run: cp openapi.json docs/openapi.json
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.11.1
      - name: Validate OpenAPI spec
        run: spectral lint openapi.json --ruleset https://unpkg.com/@stoplight/spectral-openapi/dist/ruleset.js

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (backend=false)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: TFLint
        run: tflint --init && tflint --recursive
