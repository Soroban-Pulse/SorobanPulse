name: Dependency Review

# Run on every PR. The dependency-review-action compares the base and head
# SHAs, so it only needs to run on pull_request events.
on:
  pull_request:

permissions:
  contents: read
  # Required by actions/dependency-review-action to post PR comments.
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. GitHub Dependency Review Action
  #    Flags new dependencies that carry known-vulnerable or disallowed-license
  #    advisories in the GitHub Advisory Database.  Covers all ecosystems in
  #    this repository: Rust (Cargo), npm, pip, Go.
  # --------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review (all ecosystems)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae0675f306184b0c6a87 # v4
        with:
          # Fail the check if any newly introduced dependency has a CVSS
          # score of HIGH (>= 7.0) or CRITICAL.
          fail-on-severity: high

          # Mirror the licence allow-list from deny.toml so that licence
          # violations in any package manager are caught at PR time.
          allow-licenses: >-
            MIT,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unicode-DFS-2016,
            Unicode-3.0,
            Zlib,
            0BSD,
            BSL-1.0,
            CC0-1.0

          # Comment the full diff on the PR so reviewers see what changed.
          comment-summary-in-pr: always

  # --------------------------------------------------------------------------
  # 2. npm audit — SDK (TypeScript / JavaScript) and web packages
  #    Runs npm audit --audit-level=high against each npm workspace so that
  #    vulnerable transitive dependencies are caught before merging.
  # --------------------------------------------------------------------------
  npm-audit-sdk-ts:
    name: npm audit (sdk/typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  npm-audit-sdk-js:
    name: npm audit (sdk/javascript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  npm-audit-web:
    name: npm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  npm-audit-feed-widget:
    name: npm audit (packages/feed-widget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/feed-widget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/feed-widget/package.json
      - run: npm install
      - run: npm audit --audit-level=high

  npm-audit-extension:
    name: npm audit (vscode-extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # --------------------------------------------------------------------------
  # 3. pip-audit — Python SDK
  #    pip-audit scans the installed dependencies against OSV/PyPI advisory
  #    database and fails on any HIGH or CRITICAL finding.
  # --------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (sdk/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Install SDK dependencies
        run: pip install -r requirements.txt
      - name: Run pip-audit
        # --progress-spinner=off keeps CI logs readable.
        # --strict makes pip-audit exit non-zero on any vulnerability (HIGH+).
        run: pip-audit --progress-spinner=off --strict -r requirements.txt

  # --------------------------------------------------------------------------
  # 4. govulncheck — Go SDK
  #    govulncheck uses the Go vulnerability database (vuln.go.dev) and only
  #    reports vulnerabilities that are actually reachable in the call graph.
  # --------------------------------------------------------------------------
  govulncheck:
    name: govulncheck (sdk/go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: sdk/go/go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
      - name: Run govulncheck
        run: govulncheck ./...
